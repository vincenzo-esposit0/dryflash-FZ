# Builds the runner and attaches it to a GitHub Release (docs/RELEASE.md). The action fetches it from there.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag must match the package
        run: test "v$(node -p "require('./runner/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install wasm-bindgen CLI (same version as core-wasm/Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: scripts/build-wasm.sh
      - run: npm ci
      - run: npm test -w runner
      - name: Build the package
        working-directory: runner
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dryflash-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
