name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/cpu-bench/fw/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - run: cargo fmt --all --check
      - name: Build benchmark firmware (thumbv7em-none-eabihf)
        run: tests/cpu-bench/build-fw.sh
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown -p dryflash-core-wasm -p dryflash-cpu-bench --lib
      - name: Benchmark under Node (V8)
        run: node tests/cpu-bench/node-bench.mjs target/wasm32-unknown-unknown/release/dryflash_cpu_bench.wasm tests/cpu-bench/bench-fw.bin 200 3

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-spdx.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
