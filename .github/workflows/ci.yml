# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/cpu-bench/fw/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - run: cargo fmt --all --check
      - name: Build test firmwares (thumbv7em-none-eabihf)
        run: tests/build-fw.sh
      - name: Cache pinned firmware (fetched from the original host, hash-checked)
        uses: actions/cache@v6
        with:
          path: |
            firmware/cache/official
            firmware/cache/unleashed
          key: fw-official-${{ hashFiles('firmware/compat.json') }}
      - name: Fetch pinned firmwares (official; unleashed for the OTA test)
        run: |
          node scripts/fetch-firmware.mjs official --elf
          node scripts/fetch-firmware.mjs unleashed
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Tests (including those that need the pinned firmware)
        run: cargo test --workspace --release -- --include-ignored
      - name: Check a prepared card with an independent tool (dosfstools)
        run: |
          sudo apt-get install -y dosfstools
          cargo run --release -p dryflash-core --example mkcard -- firmware/cache/official/flipper-z-f7-update-1.5.1.tgz "$RUNNER_TEMP/part.img"
          fsck.vfat -n "$RUNNER_TEMP/part.img"
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown -p dryflash-core-wasm -p dryflash-cpu-bench --lib
      - name: Benchmark under Node (V8)
        run: node tests/cpu-bench/node-bench.mjs target/wasm32-unknown-unknown/release/dryflash_cpu_bench.wasm tests/cpu-bench/bench-fw.bin 200 3

  cpu-fuzz:
    # Differential fuzzing against Unicorn 2 (dev-only reference, never distributed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: fuzz-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/cache@v6
        with:
          path: firmware/cache/official
          key: fw-official-${{ hashFiles('firmware/compat.json') }}
      - run: node scripts/fetch-firmware.mjs official --elf
      - run: cargo build --release -p dryflash-cpu-bench --bin cpu-exec
      - name: Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install unicorn==2.1.4 capstone==5.0.9
      - name: Random encodings
        run: .venv/bin/python tests/cpu-fuzz/fuzz.py target/release/cpu-exec 20000 ${{ github.run_number }}
      - name: Firmware encodings
        run: |
          tests/cpu-fuzz/corpus-from-elf.sh firmware/cache/official/flipper-z-f7-firmware-1.5.1.elf > corpus.txt
          .venv/bin/python tests/cpu-fuzz/fuzz.py target/release/cpu-exec 20000 ${{ github.run_number }} --corpus corpus.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - name: Install wasm-bindgen CLI (same version as core-wasm/Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - name: Build wasm and bindings
        run: scripts/build-wasm.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 7

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-spdx.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  # The production build on the real Worker, in the three browser engines. Firefox runs here: Playwright's
  # build of it does not start on macOS 27.
  e2e:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Cache pinned firmware (fetched from the original host, hash-checked)
        uses: actions/cache@v6
        with:
          path: firmware/cache/official
          key: fw-official-e2e-${{ hashFiles('firmware/compat.json') }}
      - run: node scripts/fetch-firmware.mjs official
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: tests/e2e
      - run: npm run e2e

  # ADR-0003 (a): deploy the Worker only after every check passed. main → production;
  # pull requests from this repository → a preview version with alias pr-<number>.
  # Pull requests from forks get no secrets and skip this job.
  deploy:
    needs: [rust, cpu-fuzz, web, licences, e2e]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Check that the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing (docs/DEPLOY.md)"
            exit 1
          fi
      - name: Deploy to production
        if: github.event_name == 'push'
        run: npx wrangler deploy --config proxy/wrangler.jsonc
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        # Only `wrangler deploy` can create the Worker, and that publishes production, which
        # happens on main alone. So until the first merge there is nothing to attach a preview
        # to: say so. Any other failure stays a failure.
        run: |
          set +e
          out=$(npx wrangler versions upload --config proxy/wrangler.jsonc \
            --preview-alias pr-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ] && grep -q "Worker that does not yet exist" <<<"$out"; then
            echo "::warning::No preview published: the Worker does not exist until the first deploy from main."
            echo "No preview published: the Worker does not exist until the first deploy from main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
