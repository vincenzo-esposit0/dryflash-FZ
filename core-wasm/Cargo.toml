[package]
name = "dryflash-core-wasm"
description = "wasm-bindgen bindings for dryflash-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dryflash-core = { path = "../core" }
# Pinned to the wasm-bindgen CLI used by scripts/build-wasm.sh (versions must match).
wasm-bindgen = "=0.2.130"
