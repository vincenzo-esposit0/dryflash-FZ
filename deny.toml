# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny: every dependency must be GPL-3.0-or-later compatible (CLAUDE.md, licence rule).
[licenses]
allow = [
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
